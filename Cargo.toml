[package]
name = "pubky-messenger"
version = "0.5.0"
edition = "2021"
# pubky 0.16 needs 1.89
rust-version = "1.89"
authors = ["Corey Phillips"]
description = "A Rust library for private messaging using Pubky"
license = "MIT"
repository = "https://github.com/coreyphillips/pubky-messenger"
keywords = ["pubky", "messaging", "encryption", "private", "chat"]
categories = ["cryptography", "network-programming"]

[dependencies]
# Core
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Pubky
# Keep pubky-common and pkarr on the versions pubky 0.16.2 builds on, so a dependent resolves
# exactly one of each. `Keypair`/`PublicKey` are pkarr's, which pubky's own types wrap.
pubky = "0.16.2"
pubky-common = "0.16.2"
pkarr = { version = "8.1", default-features = false }
# The version pubky 0.16 builds on, so its pkarr client converts into a reqwest builder
reqwest = { version = "0.13", default-features = false, features = ["cookies"] }

# Cryptography
blake3 = "1.5"
hex = "0.4"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
ed25519-dalek = { version = "3", default-features = false }
bip39 = "2.0"

# Utilities
uuid = { version = "1", features = ["v4"] }
futures = "0.3"

[dev-dependencies]
chrono = "0.4"
# Homeservers need Postgres; tests start one container per test binary through Docker
pubky-testnet = { version = "0.16.2", features = ["docker-postgres"] }
rpassword = "7"
tokio = { version = "1.44.0", features = ["full", "test-util"] }

[[example]]
name = "get_info"
path = "examples/get_info.rs"

[profile.release]
opt-level = 3
lto = true
